# Conda Environment for GTDB-NCBI Mapper
# ========================================
# Create environment with: conda env create -f environment.yml
# Activate with: conda activate gtdb_ncbi_mapper

name: gtdb_ncbi_mapper

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python>=3.9
  
  # Core data processing
  - pandas>=2.0.0
  - numpy>=1.24.0
  
  # Configuration
  - pyyaml>=6.0
  
  # Progress bars
  - tqdm>=4.65.0
  
  # Optional: for better performance
  # - pyarrow>=12.0.0

