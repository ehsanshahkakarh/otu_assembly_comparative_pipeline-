# Taxonomic Color Mapping Configuration
# =====================================
# Shared color assignments for taxa across all visualization types
# This ensures consistency between alluvial plots, scatter plots, and other visualizations
#
# SHARED TAXA ANALYSIS (Updated 2026-01-04)
# ==========================================
# This configuration ONLY includes taxa that appear in BOTH scatter plots AND alluvial plots
# All other taxa will use cross-domain fallback color pools for maximum diversity
#
# BACTERIA (7 shared taxa):
#   - Planctomycetota, Acidobacteriota, Chloroflexota, Verrucomicrobiota,
#     Myxococcota, Cyanobacteriota, Actinomycetota
#
# ARCHAEA (4 shared taxa):
#   - Euryarchaeota, Nitrososphaerota, Thermoproteota, Nanoarchaeota
#
# EUKARYOTA (10 shared taxa):
#   - Tubulinea, Rhizaria, Evosea, Alveolata, Discoba, Metamonada,
#     Discosea, Stramenopiles, Chlorophyta, Streptophyta

# Bacteria Phyla Color Assignments
# --------------------------------
# ONLY shared taxa that appear in BOTH scatter plots AND alluvial plots
bacteria_colors:
  Planctomycetota: "#ff7200"         # Orange - unique cell wall-less bacteria (26.34× novelty)
  Acidobacteriota: "#ffb44c"         # Light orange - important soil bacteria (24.66× novelty)
  Chloroflexota: "#32CD32"           # Lime green - green non-sulfur bacteria (18.45× novelty)
  Verrucomicrobiota: "#46bda3"       # Aqua - environmental bacteria (16.85× novelty)
  Myxococcota: "#7ac7da"             # Light blue - social bacteria (14.36× novelty)
  Cyanobacteriota: "#bfb1d3"         # Lavender - photosynthetic bacteria
  Actinomycetota: "#80456e"          # Plum - important antibiotic producers
  Chrysiogenota: "#008f00"           # Dark green - custom color (distinct from Verrucomicrobiota)

# Archaea Phyla Color Assignments
# -------------------------------
# ONLY shared taxa that appear in BOTH scatter plots AND alluvial plots
archaea_colors:
  Euryarchaeota: "#f51b7f"           # Bright pink - most common archaea (2.05× novelty)
  Nitrososphaerota: "#ff3f4d"        # Red - ammonia-oxidizing archaea (5.79× novelty)
  Thermoproteota: "#d19386"          # Light brown - hyperthermophilic (2.28× novelty)
  Nanoarchaeota: "#8c2a50"           # Dark pink - highest novelty factor (117.70× novelty)

# Eukaryota Division Color Assignments
# ------------------------------------
# ONLY shared taxa that appear in BOTH scatter plots AND alluvial plots
eukaryota_colors:
  Tubulinea: "#416b7d"               # Dark blue-gray - highest novelty (1323× novelty)
  Rhizaria: "#55d0ba"                # Teal - amoeboid protists (341.73× novelty)
  Evosea: "#003ce1"                  # Bright blue - amoeboid (78.42× novelty)
  Alveolata: "#c73de4"               # Magenta - diverse protists (51.67× novelty)
  Discoba: "#65417a"                 # Purple - flagellates (45.42× novelty)
  Metamonada: "#cf8ac6"              # Pink - anaerobic flagellates (26.05× novelty)
  Discosea: "#d24390"                # Hot pink - amoeboid (15.35× novelty)
  Stramenopiles: "#475093"           # Dark purple - diverse protists (11.12× novelty)
  Chlorophyta: "#663be6"             # Violet - green algae (6.75× novelty)
  Streptophyta: "#68536c"            # Gray-purple - land plants (appears in pct alluvial)
  Rhodophyta: "#008f00"              # Dark green - red algae (same as Chrysiogenota for consistency)

# Fallback Colors for Unmapped Taxa
# ---------------------------------
fallback_colors:
  bacteria: ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7", "#DDA0DD",
             "#98D8C8", "#F7DC6F", "#BB8FCE", "#85C1E9", "#F8C471", "#82E0AA"]
  archaea: ["#8B4513", "#2F4F4F", "#800080", "#008B8B", "#B22222", "#FF4500"]
  eukaryota: ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7", "#DDA0DD"]

# Special Case Colors
# ------------------
special_colors:
  Other: "#808080"                   # Gray for "Other" category
  Unknown: "#C0C0C0"                 # Light gray for unknown taxa
  unclassified_bacteria: "#9ACD32"   # Yellow-green for .U. bacterial entries (distinctive from Other and other greens)
  unclassified_archaea: "#ffcc99"    # Light orange for .U. archaeal entries  
  unclassified_eukaryota: "#ffcc99"  # Light orange for .U. eukaryotic entries

# Color Assignment Rules
# ---------------------
assignment_rules:
  priority_order: ["exact_match", "partial_match", "domain_fallback", "general_fallback"]
  case_sensitive: false
  remove_numbering: true             # Remove "1. " prefixes from taxa names
  handle_unclassified: true         # Special handling for .U. entries
