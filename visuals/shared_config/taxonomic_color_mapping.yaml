# Taxonomic Color Mapping Configuration
# =====================================
# Global registry: every named phylum/division that renders in any panel
# (scatter top-novelty/overrep + alluvial named flows) has a unique, perceptually
# distinct hex (within-domain min ΔE2000 ≥ 12; cross-domain pairs may be closer
# but never co-render).
#
# Palette generation: visuals/shared_config/generate_palette.js (iwanthue +
# greedy farthest-point with CIEDE2000). 15 anchors preserved from the previous
# round; the remaining 31 saturated + 4 muted unclassified are regenerated.
# Run `node visuals/shared_config/generate_palette.js` to refresh.

# Bacteria Phyla Color Assignments
# --------------------------------
bacteria_colors:
  # PALETTE_B "Polychrome Alphabet" (R Polychrome::alphabet inspired).
  # Selected from dry-run comparison (see visuals/shared_config/_dry_run_bacteria_palettes.py).
  # Anchors (preserved from previous palette)
  Planctomycetota: "#ff7200"         # Orange (alluvial + scatter)
  Acidobacteriota: "#94FFB5"         # Light green (alluvial + scatter; manual: swapped with Bacteroidota to reduce green dominance vs Pseudomonadota)
  Chloroflexota: "#1f3b99"           # Dark blue (alluvial + scatter)
  Actinomycetota: "#80456e"          # Plum (alluvial + scatter)
  Chrysiogenota: "#008f00"           # Dark green (scatter only)
  Thermodesulfobacteriota: "#00B7FF" # Cool cyan (alluvial + scatter; manual: de-gold'd from Acidobacteriota)
  # PALETTE_B non-anchors
  Abditibacteriota: "#9DCC00"
  Armatimonadota: "#0075DC"
  Bacillota: "#FF0010"               # alluvial + scatter
  Bacteroidota: "#ffb44c"            # alluvial + scatter (manual: swapped with Acidobacteriota)
  Bdellovibrionota: "#740AFF"
  Calditrichota: "#FFA8BB"
  Campylobacterota: "#005C31"        # alluvial + scatter
  Chlamydiota: "#5EF1F2"
  Chlorobiota: "#993F00"
  Cyanobacteriota: "#fb00d1"         # alluvial + scatter (manual: B4_dark, de-blued from Chloroflexota)
  Dictyoglomota: "#C20088"
  Gemmatimonadota: "#426600"
  Ignavibacteriota: "#4C005C"
  Mycoplasmatota: "#F0A0FF"
  Myxococcota: "#766C95"
  Patescibacteria: "#00998F"         # alluvial + scatter
  Pseudomonadota: "#2BCE48"          # alluvial + scatter
  Thermomicrobiota: "#FF5005"
  Verrucomicrobiota: "#9A4D42"       # alluvial + scatter

# Archaea Phyla Color Assignments
# -------------------------------
archaea_colors:
  # Anchors (all alluvial + scatter)
  Euryarchaeota: "#f51b7f"
  Nitrososphaerota: "#ff3f4d"
  Thermoproteota: "#d19386"
  Nanoarchaeota: "#8c2a50"
  # Generated (scatter family-panel parent phyla + alluvial Asgard classes)
  Heimdallarchaeia: "#a90aa1"        # alluvial
  Lokiarchaeia: "#2874a6"            # alluvial (manual: steel blue)
  Nanobdellota: "#036c15"
  Odinarchaeia: "#cdaa29"            # alluvial
  Thermoplasmatota: "#79a20e"

# Eukaryota Division Color Assignments
# ------------------------------------
# NCBI phyla returned from family-panel lineage lookup (Apicomplexa, Ciliophora,
# Ascomycota, Basidiomycota, Chytridiomycota, Fornicata, Heterolobosea) are
# remapped to their Pr2 division by standardize_phylum_names() in
# mega_comprehensive_stacked_visual.R before color lookup.
eukaryota_colors:
  # PALETTE_E3_GLASBEY (Polychrome::glasbey-derived).
  # Selected from dry-run comparison (see visuals/shared_config/_dry_run_eukaryota_palettes.py).
  # Anchors (alluvial + scatter)
  Tubulinea: "#416b7d"               # scatter only
  Rhizaria: "#feaf16"                # manual: E2_palette36 Opisthokonta yellow (de-cyan'd vs Opisthokonta blue)
  Alveolata: "#c73de4"
  Discosea: "#d24390"                # scatter only
  Stramenopiles: "#475093"
  # PALETTE_E3_GLASBEY non-anchors
  Chlorophyta: "#ff0000"             # scatter only
  Discoba: "#00ff00"
  Evosea: "#ff00b6"                  # scatter only
  Metamonada: "#005300"              # scatter only
  Opisthokonta: "#009fff"
  Rhodophyta: "#9a4d42"              # scatter only
  Streptophyta: "#00ffbe"

# Special Case Colors
# ------------------
# Unclassified (.U.) bins are deliberately low-chroma muted tones so they
# don't compete visually with the saturated named-taxon colors.
special_colors:
  Other: "#808080"                   # Mid gray - "Other" category
  Unknown: "#C0C0C0"                 # Light gray - unknown taxa
  # Per-domain .U. tones (looked up by full taxon key first, then by
  # unclassified_<domain> fallback below)
  "Bacteria.U.phylum": "#7d9690"     # Muted slate-green
  "Archaea.U.phylum": "#cabad2"      # Muted lavender
  "Eukaryota.U.division": "#c8a99f"  # Muted rosy beige
  "Amoebozoa.U.division": "#aac6d6"  # Muted ice blue
  # Legacy per-domain keys (used if no exact .U. match above)
  unclassified_bacteria: "#7d9690"
  unclassified_archaea: "#cabad2"
  unclassified_eukaryota: "#c0b8a6"

# Color Assignment Rules
# ---------------------
assignment_rules:
  priority_order: ["exact_match", "partial_match", "domain_fallback", "general_fallback"]
  case_sensitive: false
  remove_numbering: true             # Remove "1. " prefixes from taxa names
  handle_unclassified: true         # Special handling for .U. entries
