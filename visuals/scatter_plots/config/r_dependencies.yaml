# R Dependencies Configuration for Comprehensive Visual
# ====================================================
# This YAML file specifies all R packages and their versions required
# for the mega comprehensive stacked visual script

# Core R Requirements
# ------------------
r_version:
  minimum: "4.0.0"
  recommended: "4.3.0"
  tested_versions: ["4.2.3", "4.3.1", "4.3.2"]

# Essential Packages (Required)
# -----------------------------
essential_packages:
  # Data manipulation and processing
  - name: "dplyr"
    version: ">= 1.1.0"
    purpose: "Data filtering, grouping, and manipulation"
    critical: true
    alternatives: ["base R functions"]
    notes: "May have GLIBCXX compatibility issues on some systems"
  
  # Visualization core
  - name: "ggplot2"
    version: ">= 3.4.0"
    purpose: "Core plotting and visualization framework"
    critical: true
    alternatives: []
    notes: "Essential for all scatter plots and visualizations"
  
  # Plot layout and arrangement
  - name: "cowplot"
    version: ">= 1.1.0"
    purpose: "Plot arrangement and grid layouts"
    critical: true
    alternatives: ["gridExtra", "patchwork"]
    notes: "Used for 2x3 grid layout arrangement"
  
  - name: "grid"
    version: "base"
    purpose: "Low-level grid graphics for layout control"
    critical: true
    alternatives: []
    notes: "Base R package, should be available by default"

# Annotation and Labeling
# -----------------------
annotation_packages:
  - name: "ggrepel"
    version: ">= 0.9.0"
    purpose: "Smart text label positioning to avoid overlaps"
    critical: true
    alternatives: ["manual positioning"]
    notes: "Essential for novelty and coverage factor annotations"

# Utility and Formatting
# ----------------------
utility_packages:
  - name: "scales"
    version: ">= 1.2.0"
    purpose: "Scale transformations and formatting (log scales, percentages)"
    critical: true
    alternatives: ["manual scale functions"]
    notes: "Used for log10 axis transformations and formatting"

# Configuration and Data Handling
# -------------------------------
config_packages:
  - name: "yaml"
    version: ">= 2.3.0"
    purpose: "YAML configuration file parsing"
    critical: false
    alternatives: ["hardcoded configurations"]
    notes: "Needed if script is updated to read YAML configs directly"
  
  - name: "jsonlite"
    version: ">= 1.8.0"
    purpose: "JSON color palette file reading"
    critical: false
    alternatives: ["hardcoded colors", "YAML colors"]
    notes: "Currently used for reading color JSON files"

# Optional Enhancement Packages
# -----------------------------
optional_packages:
  # Alternative layout packages
  - name: "gridExtra"
    version: ">= 2.3"
    purpose: "Alternative to cowplot for plot arrangement"
    critical: false
    alternatives: ["cowplot", "patchwork"]
    notes: "Can replace cowplot if compatibility issues arise"
  
  - name: "patchwork"
    version: ">= 1.1.0"
    purpose: "Modern alternative for plot composition"
    critical: false
    alternatives: ["cowplot", "gridExtra"]
    notes: "More intuitive syntax than cowplot"
  
  # Enhanced data manipulation
  - name: "tidyr"
    version: ">= 1.3.0"
    purpose: "Data reshaping and tidying"
    critical: false
    alternatives: ["base R reshape functions"]
    notes: "Useful for data preprocessing if needed"
  
  # Color palette management
  - name: "RColorBrewer"
    version: ">= 1.1-3"
    purpose: "Additional color palettes"
    critical: false
    alternatives: ["custom color vectors"]
    notes: "Backup color palettes if custom colors fail"
  
  - name: "viridis"
    version: ">= 0.6.0"
    purpose: "Colorblind-friendly palettes"
    critical: false
    alternatives: ["custom color vectors"]
    notes: "Alternative color schemes for accessibility"

# System Dependencies
# ------------------
system_requirements:
  # Graphics libraries
  graphics_libs:
    - "libcairo2-dev"     # Cairo graphics library
    - "libxt-dev"         # X11 toolkit library
    - "libx11-dev"        # X11 client library
  
  # Font libraries
  font_libs:
    - "libfontconfig1-dev"  # Font configuration library
    - "libfreetype6-dev"    # FreeType font engine
  
  # Image processing
  image_libs:
    - "libpng-dev"        # PNG image library
    - "libjpeg-dev"       # JPEG image library
    - "libtiff5-dev"      # TIFF image library
  
  # Notes for system dependencies
  system_notes: |
    System dependencies are typically required for:
    - PNG/PDF output generation
    - Font rendering in plots
    - Graphics device initialization
    Install using: sudo apt-get install <package-name> (Ubuntu/Debian)

# Installation Methods
# -------------------
installation:
  # CRAN installation (recommended)
  cran_install:
    method: "install.packages"
    example: 'install.packages(c("ggplot2", "dplyr", "cowplot", "ggrepel", "scales"))'
    repos: "https://cran.r-project.org"
  
  # Conda installation (alternative)
  conda_install:
    method: "conda install"
    channel: "conda-forge"
    example: 'conda install -c conda-forge r-ggplot2 r-dplyr r-cowplot r-ggrepel r-scales'
    notes: "Prefix R packages with 'r-' in conda"
  
  # Development versions (if needed)
  github_install:
    method: "remotes::install_github"
    example: 'remotes::install_github("tidyverse/ggplot2")'
    notes: "Only use for bleeding-edge features or bug fixes"

# Known Issues and Compatibility
# ------------------------------
compatibility:
  # Library conflicts
  known_issues:
    - issue: "GLIBCXX_3.4.29 not found"
      affected_packages: ["dplyr"]
      solutions: 
        - "Use system R instead of conda R"
        - "Replace dplyr operations with base R"
        - "Update gcc/g++ libraries"
      workaround: "Script modified to reduce dplyr dependency"
    
    - issue: "Cairo graphics not available"
      affected_packages: ["ggplot2"]
      solutions:
        - "Install cairo system libraries"
        - "Use different graphics device"
      workaround: "Specify device explicitly in ggsave()"
    
    - issue: "Font rendering problems"
      affected_packages: ["ggplot2", "cowplot"]
      solutions:
        - "Install font libraries"
        - "Use basic fonts only"
      workaround: "Set family='' in theme() calls"

# Version Lock File (for reproducibility)
# ---------------------------------------
version_lock:
  # Tested working combination
  tested_combination:
    R: "4.3.1"
    ggplot2: "3.4.2"
    dplyr: "1.1.2"
    cowplot: "1.1.1"
    ggrepel: "0.9.3"
    scales: "1.2.1"
    grid: "base"
  
  # Last successful run
  last_successful:
    date: "2025-11-12"
    R_version: "4.3.1"
    platform: "linux-gnu"
    notes: "All visualizations generated successfully"

# Package Loading Strategy
# -----------------------
loading_strategy:
  # Suppress startup messages
  suppress_messages: true
  method: "suppressPackageStartupMessages"
  
  # Load order (dependencies first)
  load_order:
    1: "grid"          # Base graphics
    2: "scales"        # Utility functions
    3: "ggplot2"       # Core plotting
    4: "dplyr"         # Data manipulation
    5: "ggrepel"       # Text positioning
    6: "cowplot"       # Layout arrangement
  
  # Error handling
  error_handling:
    continue_on_optional_failure: true
    stop_on_essential_failure: true
    provide_alternatives: true

# Maintenance and Updates
# ----------------------
maintenance:
  # Update frequency
  check_updates: "monthly"
  
  # Update strategy
  update_policy: "conservative"  # Only update for bug fixes, not new features
  
  # Testing requirements
  test_before_update: true
  test_script: "test_dependencies.R"
  
  # Rollback plan
  rollback_strategy: "version_lock"
  backup_versions: true
